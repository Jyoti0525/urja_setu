[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "urja-setu-backend"
version = "0.1.0"
description = "URJA-SETU API gateway + deterministic simulation engine + knowledge graph"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["urja_setu_backend"]

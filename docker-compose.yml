services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: urja_postgres
    environment:
      POSTGRES_USER: urja
      POSTGRES_PASSWORD: urja
      POSTGRES_DB: urja
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urja"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: urja_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
